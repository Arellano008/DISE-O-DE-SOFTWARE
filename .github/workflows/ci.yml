name: CI

on:
  push: 
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js 
        uses: actions/setup-node@v4 
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias (los pollitos)
        run: npm install
      - name: Compilar proyecto
        run: npm run build
